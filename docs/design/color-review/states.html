*{box-sizing:border-box}
body{margin:0;font:14px/1.55 'Segoe UI',Arial,sans-serif;color:var(--ink);background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{border:1px solid var(--line);background:var(--paper);padding:8px 12px;border-radius:8px;cursor:pointer}
button:hover{background:var(--soft)}button:disabled{opacity:.45;cursor:not-allowed}
button.major{background:var(--brand);color:light-dark(#fff,#142239);border-color:var(--brand)}
input,select,textarea{width:100%;padding:8px 10px;background:var(--paper);border:1px solid var(--line);border-radius:7px}
label{display:block;margin-bottom:10px}label>span{display:block;color:var(--sub);font-size:12px;margin-bottom:4px}
a{color:var(--brand)}
.shell{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
nav{background:var(--paper);border-right:1px solid var(--line);padding:14px}

nav .who{color:var(--sub);font-size:12px;margin-bottom:14px}
nav a{display:block;padding:8px 10px;border-radius:8px;text-decoration:none;color:var(--ink);margin-bottom:2px}
nav a.on{background:var(--soft);color:var(--brand);font-weight:600}
main{padding:20px;max-width:1100px;min-width:0}
h2{margin:0 0 4px;font-size:19px}.lead{color:var(--sub);margin:0 0 16px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px;overflow-x:auto}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.kpi b{display:block;font-size:24px;margin-top:4px}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--sub);font-size:12px;font-weight:600}
.tag{display:inline-block;padding:2px 8px;border-radius:99px;border:1px solid var(--line);font-size:12px;background:var(--bg)}
.tag.ok{color:var(--good);border-color:currentColor}.tag.warn{color:var(--warn);border-color:currentColor}
.tag.bad{color:var(--bad);border-color:currentColor}
.sim{background:light-dark(#fff6e5,#3a2d17);border:1px solid var(--warn);color:var(--warn);padding:8px 10px;border-radius:8px;font-size:12px;margin-bottom:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.thread{max-height:46vh;overflow:auto;display:flex;flex-direction:column;gap:8px;padding:4px}
.msg{padding:8px 10px;border-radius:10px;max-width:78%;border:1px solid var(--line);background:var(--bg)}
.msg.agent{align-self:flex-end;background:var(--soft);border-color:var(--brand)}
.msg.system{align-self:center;font-size:12px;color:var(--sub);background:transparent;border:0}
.msg small{display:block;color:var(--sub);font-size:11px}
.err{color:var(--bad);margin:8px 0}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--paper);color:var(--ink);max-width:460px;width:92%}
@media(max-width:820px){.shell{grid-template-columns:1fr}nav{border-right:0;border-bottom:1px solid var(--line)}
nav a{display:inline-block}main{padding:14px}}
