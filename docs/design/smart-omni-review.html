<style>
#omni-review{--paper:light-dark(#fff,#17212c);--bg:light-dark(#f4f6f9,#101821);--ink:light-dark(#203044,#e7edf5);--sub:light-dark(#617185,#a3b2c4);--line:light-dark(#dee5ee,#344251);--brand:light-dark(#174db8,#a9c7ff);--soft:light-dark(#eaf1ff,#253953);--good:light-dark(#176344,#86d6b0);--warn:light-dark(#8b4d10,#f1c389);font:14px/1.55 'Segoe UI',Arial,sans-serif;color:var(--ink);background:var(--bg);border-radius:16px;overflow:hidden;border:1px solid var(--line);color-scheme:light dark;--space:20px}
#omni-review *{box-sizing:border-box}#omni-review button,#omni-review input,#omni-review select,#omni-review textarea{font:inherit;color:inherit}#omni-review button{border:1px solid var(--line);background:var(--paper);padding:9px 13px;border-radius:8px;cursor:pointer;text-align:left}#omni-review button:hover{background:var(--soft)}#omni-review button:disabled{opacity:.48;cursor:not-allowed}#omni-review button.major{background:var(--brand);color:light-dark(#fff,#142239);border-color:var(--brand)}#omni-review button.selected{background:var(--soft);color:var(--brand);border-color:var(--brand)}#omni-review input:not([type=checkbox]),#omni-review select,#omni-review textarea{width:100%;padding:9px 10px;background:var(--paper);border:1px solid var(--line);border-radius:7px}#omni-review textarea{min-height:90px;resize:vertical}#omni-review label{display:block}#omni-review label>span{display:block;color:var(--sub);font-size:12px;margin-bottom:5px}#omni-review input[type=checkbox]{margin-right:7px}#omni-review h1{font-size:23px;line-height:1.25;margin:0 0 6px;font-weight:600}#omni-review h2{font-size:17px;margin:0 0 14px;font-weight:600}#omni-review h3{font-size:14px;margin:0 0 9px;font-weight:600}#omni-review p{margin:0 0 12px}#omni-review .muted{color:var(--sub)}#omni-review .small{font-size:12px}#omni-review .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}#omni-review .between{justify-content:space-between}#omni-review .top{padding:16px 22px;background:var(--paper);border-bottom:1px solid var(--line)}#omni-review .logo{font-weight:700;font-size:18px;letter-spacing:-.5px}#omni-review .logo em{font-style:normal;color:var(--brand)}#omni-review .demo{font-size:12px;padding:5px 9px;border-radius:5px;background:var(--soft);color:var(--brand)}#omni-review .role{max-width:225px}#omni-review .shell{display:grid;grid-template-columns:172px minmax(0,1fr)}#omni-review nav{padding:18px 10px;background:var(--paper);border-right:1px solid var(--line)}#omni-review nav button{display:flex;align-items:center;gap:9px;width:100%;margin-bottom:7px;border:0;background:transparent}#omni-review nav button.active{background:var(--soft);color:var(--brand);font-weight:600}#omni-review .navnum{font-size:12px;color:var(--sub);width:20px}#omni-review .navfoot{margin:28px 8px 0;font-size:12px;color:var(--sub)}#omni-review main{padding:var(--space);min-width:0}#omni-review .title{margin-bottom:20px}#omni-review .panel{background:var(--paper);border:1px solid var(--line);border-radius:11px;padding:18px;min-width:0}#omni-review .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}#omni-review .inbox{display:grid;grid-template-columns:215px minmax(0,1fr);gap:14px}#omni-review .stack>*+*{margin-top:12px}#omni-review .contact{display:block;width:100%;margin:9px 0;padding:13px}#omni-review .contact span{display:block}#omni-review .tag{display:inline-block;font-size:12px;padding:3px 8px;border-radius:20px;background:var(--bg);border:1px solid var(--line)}#omni-review .ok{color:var(--good)}#omni-review .warning{color:var(--warn)}#omni-review .divider{border:0;border-top:1px solid var(--line);margin:17px 0}#omni-review .bubble{padding:11px 14px;border-radius:12px;background:var(--bg);max-width:92%;margin-bottom:12px}#omni-review .bubble.out{margin-left:auto;background:var(--soft)}#omni-review .bubble small{display:block;color:var(--sub);margin-bottom:3px}#omni-review .chat{padding:12px 0;min-height:150px}#omni-review .candidate{border-top:1px solid var(--line);padding:12px 0;display:flex;gap:12px;justify-content:space-between;align-items:center}#omni-review .avatar{width:34px;height:34px;display:inline-grid;place-items:center;border-radius:50%;background:var(--soft);color:var(--brand);flex-shrink:0}#omni-review .notice{border-left:3px solid var(--brand);padding:9px 12px;background:var(--soft);margin:12px 0;font-size:13px}#omni-review #omni-status{padding:10px 20px;background:var(--paper);border-top:1px solid var(--line);font-size:13px;min-height:42px}#omni-review .fieldgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}#omni-review .fieldgrid .full{grid-column:1/-1}#omni-review .steps{display:flex;gap:5px;flex-wrap:wrap;margin:14px 0}#omni-review .steps span{padding:5px 8px;background:var(--bg);border-radius:5px;font-size:12px}#omni-review .steps .on{background:var(--soft);color:var(--brand);font-weight:600}#omni-review .amount{font-size:24px;font-weight:600;font-variant-numeric:tabular-nums}#omni-review .quotehead{border-bottom:2px solid var(--brand);padding-bottom:16px;margin-bottom:18px}#omni-review .summaryrow{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}#omni-review .summaryrow:last-child{border:0}#omni-review .listline{padding:12px 0;border-bottom:1px solid var(--line)}#omni-review .listline:last-child{border:0}#omni-review .kanban{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}#omni-review .lane{padding:11px;background:var(--bg);border-radius:9px;min-height:85px}#omni-review .deal{margin-top:9px;background:var(--paper);padding:12px;border:1px solid var(--line);border-radius:7px}#omni-review .reviewline{display:flex;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}#omni-review .reviewline strong{color:var(--brand)}#omni-review .audit{padding-left:18px;color:var(--sub);font-size:12px}#omni-review .check{display:flex;gap:8px;align-items:flex-start}#omni-review .compact{padding:12px}#omni-review .day{display:flex;gap:9px;flex-wrap:wrap}#omni-review .day label{background:var(--bg);padding:6px 9px;border-radius:5px}#omni-review .empty{padding:32px 15px;text-align:center;color:var(--sub)}#omni-review .mb{margin-bottom:14px}
@media(max-width:800px){#omni-review .shell{grid-template-columns:1fr}#omni-review nav{display:flex;gap:5px;flex-wrap:wrap;border-right:0;border-bottom:1px solid var(--line);padding:8px}#omni-review nav button{width:auto;margin:0;padding:8px}#omni-review .navfoot{display:none}#omni-review .navnum{display:none}}
@media(max-width:600px){#omni-review .grid,#omni-review .inbox,#omni-review .fieldgrid{grid-template-columns:1fr}#omni-review .kanban{grid-template-columns:1fr 1fr}#omni-review .top{padding:14px}#omni-review main{padding:12px}#omni-review .role{max-width:none;width:100%}#omni-review input,#omni-review select,#omni-review textarea{font-size:16px!important}#omni-review h1{font-size:21px}#omni-review .panel{padding:14px}#omni-review .candidate{align-items:flex-start;flex-wrap:wrap}}
</style>
<div id="omni-review" aria-label="Bản thiết kế Smart Omni CRM">
 <header class="top row between"><div><div class="logo">iViTech <em>Smart Omni</em></div><div class="small muted">Không gian làm việc của đội kinh doanh</div></div><span class="demo">BẢN DUYỆT • dữ liệu mẫu • không gửi thật</span><label class="role"><span>Đóng vai để thử màn hình</span><select id="omni-role"><option value="manager">Mai · Trưởng nhóm</option><option value="lan">Lan · Sales</option><option value="thu">Thu · Sales</option><option value="director">Giám đốc · Duyệt</option><option value="admin">Admin · Cấu hình</option></select></label></header>
 <div class="shell"><nav aria-label="Chức năng"><button data-page="inbox" class="active"><span class="navnum">01</span>Hộp thư & giao khách</button><button data-page="customer"><span class="navnum">02</span>Hồ sơ khách hàng</button><button data-page="pipeline"><span class="navnum">03</span>Cơ hội bán hàng</button><button data-page="quote"><span class="navnum">04</span>Báo giá</button><button data-page="knowledge"><span class="navnum">05</span>Nội dung bot</button><button data-page="settings"><span class="navnum">06</span>Cấu hình</button><button data-page="guide"><span class="navnum">07</span>Kịch bản duyệt</button><div class="navfoot">Nhóm thử nghiệm<br>2 sales · 1 trưởng nhóm<hr class="divider">Zalo OA + 1 Zalo cá nhân<br>Kết nối đang mô phỏng</div></nav><main id="omni-main"></main></div>
 <div id="omni-status" role="status" aria-live="polite">Bắt đầu: chọn khách mới và giao cho một sales được gợi ý.</div>
</div>
<script>
(()=>{
 const root=document.getElementById('omni-review'), main=root.querySelector('#omni-main');
 const fresh=()=>({page:'inbox',role:'manager',cid:'org',owners:{org:null,person:'thu'},human:{org:false,person:true},chats:{org:[['Khách · Zalo OA','Tôi muốn tìm hiểu Smart iVier và gói chatbot cho đơn vị.']],person:[['Khách · Zalo cá nhân công ty','Tôi muốn được tư vấn chương trình đào tạo AI.'],['Thu · nhân viên','Em sẽ gửi anh nội dung chương trình phù hợp.']]},stage:'Xác định nhu cầu',signed:false,history:['Tạo cơ hội mẫu · Smart iVier'],quote:{customer:'org',type:'ivier',pkg:'g3',discount:0,hasCore:false,state:'Nháp',version:1,log:[]},kb:{text:'Dịch vụ đào tạo có thời hạn 12 tháng từ ngày kích hoạt. Nhân viên sẽ tư vấn gói phù hợp với nhu cầu.',state:'Đã duyệt',version:1,approvedText:'Dịch vụ đào tạo có thời hạn 12 tháng từ ngày kích hoạt. Nhân viên sẽ tư vấn gói phù hợp với nhu cầu.',log:['Giám đốc đã duyệt bản mẫu v1']},config:{money:'',discount:'',start:'08:00',end:'17:00',days:[true,true,true,true,true,false,false],saved:false}});
 let s=fresh(); const saved=window.openai?.widgetState?.privateContent?.omni;
 if(saved&&saved.schema===1&&saved.data?.kb&&saved.data?.config)s=saved.data;
 const design={density:'Thoáng',preview:true};
 const names={manager:'Mai',lan:'Lan',thu:'Thu',director:'Giám đốc',admin:'Admin'};
 const clients={org:{name:'Đơn vị Bình Minh',type:'Cơ quan · hồ sơ giả',channel:'Zalo OA',interest:'Smart iVier',initial:'BM'},person:{name:'Nguyễn An',type:'Cá nhân · hồ sơ giả',channel:'Zalo cá nhân công ty',interest:'Đào tạo AI',initial:'NA'}};
 const packages={g1:['Gói 1 · Điều hành số',499000000,349000000],g2:['Gói 2 · 100 người dùng',379000000,329000000],g3:['Gói 3 · Chatbot AI',499000000,429000000],g4:['Gói 4 · Zalo Mini App',479000000,229000000],all:['Trọn bộ Gói 1–4',1629000000,1149000000],ai05:['AI 05 · 5 tài khoản',90000000,null],ai10:['AI 10 · 10 tài khoản',125000000,null],ai20:['AI 20 · 20 tài khoản',219000000,null]};
 const stages=['Mới','Xác định nhu cầu','Tư vấn/Demo','Gửi báo giá','Đàm phán','Thắng','Thua'];
 const esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const money=v=>new Intl.NumberFormat('vi-VN').format(v)+' ₫';
 const badge=t=>`<span class="tag">${esc(t)}</span>`;
 const btn=(a,t,disabled=false,major=false)=>`<button data-action="${a}" ${disabled?'disabled':''} class="${major?'major':''}">${t}</button>`;
 const head=(t,sub)=>`<div class="title"><h1>${t}</h1><div class="muted">${sub}</div></div>`;
 const canSee=id=>s.role==='manager'||(['lan','thu'].includes(s.role)&&s.owners[id]===s.role);
 const canWork=id=>canSee(id)&&!!s.owners[id];
 const visible=()=>Object.keys(clients).filter(canSee);
 function persist(){window.openai?.setWidgetState?.({modelContent:{prototype:'Smart Omni CRM',screen:s.page,role:s.role,quote:s.quote.state,botContent:s.kb.state},privateContent:{omni:{schema:1,data:s}}}).catch(()=>{});}
 function tell(t){root.querySelector('#omni-status').textContent=t;}
 function logs(items){return `<ul class="audit">${items.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`;}
 function blocked(){return `<div class="panel empty">Vai trò này không mở màn hình nghiệp vụ khách hàng trong bản mẫu.<br>Chọn Trưởng nhóm hoặc Sales để xem theo phạm vi được giao.</div>`;}
 function selected(){const ids=visible();if(!ids.includes(s.cid)&&ids.length)s.cid=ids[0];return ids.length>0;}
 function customerTabs(){return visible().map(id=>`<button data-client="${id}" class="${s.cid===id?'selected':''}">${esc(clients[id].name)}</button>`).join('');}
 function inbox(){
  if(!selected())return head('Hộp thư','Hội thoại trong phạm vi của bạn')+blocked();
  const c=clients[s.cid],owner=s.owners[s.cid],human=s.human[s.cid];
  const list=visible().map(id=>`<button class="contact ${id===s.cid?'selected':''}" data-client="${id}"><span>${esc(clients[id].name)}</span><span class="small muted">${clients[id].channel}</span><span class="small">${s.owners[id]?'Phụ trách: '+names[s.owners[id]]:'Chờ trưởng nhóm giao'}</span></button>`).join('');
  const order=s.cid==='org'?['lan','thu']:['thu','lan'];
  const rec=order.map((id,i)=>`<div class="candidate"><div class="row"><span class="avatar">${names[id][0]}</span><div><strong>${names[id]}</strong>${i===0?' <span class="small ok">Ưu tiên</span>':''}<div class="small muted">${i===0?'Am hiểu '+c.interest:'Kinh nghiệm sản phẩm ít hơn'}<br>${id==='lan'?3:1} khách cần xử lý · số liệu giả</div></div></div>${btn('assign-'+id,'Giao cho '+names[id],!!owner||s.role!=='manager')}</div>`).join('');
  return head('Hộp thư & phân công','Đúng khách, đúng người phụ trách — trên cùng một màn hình')+`<div class="inbox"><section class="panel compact"><h3>Hội thoại</h3>${list}<div class="small muted">Cả hai kênh đang mô phỏng.<br>Sales chỉ thấy khách đã giao.</div></section><section class="panel"><div class="row between"><div><h2>${c.name}</h2><span class="small muted">${c.type} · ${c.channel}</span></div>${badge(human?'Nhân viên đang xử lý':'Bot đang hỗ trợ')}</div><div class="chat">${s.chats[s.cid].map(([who,text])=>`<div class="bubble ${who.startsWith('Khách')?'':'out'}"><small>${esc(who)}</small>${esc(text)}</div>`).join('')}</div><div class="row mb">${btn('take','Tiếp nhận · dừng bot',!canWork(s.cid)||human)}${btn('return','Chuyển lại cho bot',!canWork(s.cid)||!human)}${btn('incoming','Thử tin nhắn mới')}</div><label><span>Trả lời từ ${c.channel}</span><textarea id="reply" placeholder="Soạn phản hồi mẫu..." ${!human||!canWork(s.cid)?'disabled':''}></textarea></label><div class="row between" style="margin-top:10px"><span class="small muted">${owner?'Người phụ trách: '+names[owner]:'Giao khách trước khi nhân viên tiếp nhận'}</span>${btn('send-reply','Gửi mô phỏng',!human||!canWork(s.cid),true)}</div></section></div>${s.role==='manager'?`<section class="panel" style="margin-top:14px"><div class="row between"><h2>${owner?'Khách đã có người phụ trách':'Gợi ý sales phù hợp'}</h2>${badge('Quyết định cuối: trưởng nhóm')}</div>${owner?`<p>Tiếp tục chuyển về <strong>${names[owner]}</strong>. Không tự phân công lại.</p>`:`<div class="small muted">Ưu tiên am hiểu sản phẩm, sau đó ít khách cần xử lý hơn.</div>${rec}`}</section>`:''}`;
 }
 function customer(){if(!selected())return head('Hồ sơ khách hàng','Thông tin thống nhất cho doanh nghiệp và cá nhân')+blocked();const c=clients[s.cid];return head('Hồ sơ khách hàng','Từ hội thoại đến nhu cầu và cơ hội bán hàng')+`<div class="row mb">${customerTabs()}</div><div class="grid"><section class="panel"><div class="row mb"><span class="avatar">${c.initial}</span><div><h2 style="margin:0">${c.name}</h2><span class="small muted">${c.type}</span></div></div><div class="summaryrow"><span>Nhu cầu</span><strong>${c.interest}</strong></div><div class="summaryrow"><span>Người phụ trách</span><span>${s.owners[s.cid]?names[s.owners[s.cid]]:'Chưa giao'}</span></div><div class="summaryrow"><span>Kênh đang trao đổi</span><span>${c.channel}</span></div><div class="summaryrow"><span>Công ty liên quan</span><span>${s.cid==='person'?'Không bắt buộc':'Đơn vị Bình Minh'}</span></div><div class="row" style="margin-top:16px">${btn('go-inbox','Mở hội thoại')}${btn('go-quote','Lập báo giá',!canWork(s.cid),true)}</div></section><section class="panel"><h2>Lịch sử tương tác</h2>${s.chats[s.cid].map(([who,t])=>`<div class="listline"><span class="small muted">${esc(who)}</span><div>${esc(t)}</div></div>`).join('')}<div class="notice">Dữ liệu mẫu không sử dụng tên, số điện thoại hoặc lịch sử của khách thật.</div></section></div>`;}
 function pipeline(){if(!canSee('org'))return head('Cơ hội bán hàng','Theo dõi tiến độ và lịch sử')+blocked();return head('Cơ hội bán hàng','Smart iVier · Đơn vị Bình Minh · dữ liệu mẫu')+`<section class="panel"><div class="kanban">${stages.map(st=>`<div class="lane"><span class="small">${st}</span>${s.stage===st?`<div class="deal"><strong>Triển khai Smart iVier</strong><div class="small muted">${s.owners.org?names[s.owners.org]:'Chưa phân công'}</div>${badge('Đang ở bước này')}</div>`:''}</div>`).join('')}</div><hr class="divider"><div class="fieldgrid"><label><span>Chuyển bước (quyền thao tác minh họa)</span><select id="stage">${stages.map(st=>`<option ${st===s.stage?'selected':''}>${st}</option>`).join('')}</select></label><label><span>Lý do thua / lý do mở lại</span><input id="stage-reason" placeholder="Nhập lý do khi áp dụng"></label></div><label class="check" style="margin:14px 0"><input type="checkbox" id="signed" ${s.signed?'checked':''}>Hai bên đã ký hợp đồng (xác nhận mẫu)</label><div class="row">${btn('stage-save',s.stage==='Thua'?'Mở lại / cập nhật bước':'Cập nhật bước',!canWork('org'),true)}</div><div class="small muted" style="margin-top:12px">Thắng chỉ khi hai bên đã ký. Mở lại cơ hội thua bắt buộc lý do; quyền chuyển bước chi tiết đang đề xuất.</div><hr class="divider"><h3>Lịch sử giữ nguyên</h3>${logs(s.history)}</section>`;}
 function quote(){
  const q=s.quote; q.customer=q.customer||'org'; const p=packages[q.pkg],base=p[1],total=Math.round(base*(1-q.discount/100));
  const needCore=['g2','g3','g4'].includes(q.pkg),config=s.config.money!==''&&s.config.discount!=='';
  const proposedApprover=config&&(total>Number(s.config.money)*1000000||q.discount>Number(s.config.discount))?'director':'manager'; const approver=q.state==='Chờ duyệt'?q.approver:proposedApprover;
  const edit=['Nháp','Yêu cầu sửa'].includes(q.state),isSales=['lan','thu'].includes(s.role),canEdit=edit&&canWork(q.customer),allowed=canSee(q.customer)||s.role==='director';
  if(!allowed)return head('Báo giá','Tạo mẫu · duyệt · gửi')+blocked();
  const training=q.type==='training';
  return head('Báo giá','Hai mẫu theo dịch vụ · giá từ tài liệu tham khảo, chưa phải bảng giá hiện hành')+`<div class="row between mb"><div class="row">${badge('BG-MẪU-001 · v'+q.version)}${badge(q.state)}</div><span class="small muted">Khách: ${clients[q.customer].name}</span></div><div class="steps">${['Nháp','Chờ duyệt','Đã duyệt','Đã gửi'].map(x=>`<span class="${x===q.state?'on':''}">${x}</span>`).join('')}</div><div class="grid"><section class="panel"><h2>Nội dung báo giá</h2><div class="fieldgrid"><label class="full"><span>Mẫu theo loại dịch vụ</span><select id="quote-type" ${canEdit?'':'disabled'}><option value="ivier" ${!training?'selected':''}>Giải pháp Smart iVier</option><option value="training" ${training?'selected':''}>Đào tạo & chuyển giao AI</option></select></label><label class="full"><span>Phương án chào · chỉ chọn một</span><select id="quote-package" ${canEdit?'':'disabled'}>${Object.entries(packages).filter(([k])=>training?k.startsWith('ai'):!k.startsWith('ai')).map(([k,v])=>`<option value="${k}" ${q.pkg===k?'selected':''}>${v[0]}</option>`).join('')}</select></label><label><span>Giảm thêm ngoài giá gói (%)</span><input id="quote-discount" type="number" min="0" max="100" value="${q.discount}" ${canEdit?'':'disabled'}></label><label><span>Thuế</span><input value="Chưa xác định" disabled></label></div>${needCore?`<label class="check" style="margin-top:15px"><input id="core" type="checkbox" ${q.hasCore?'checked':''} ${canEdit?'':'disabled'}>Khách đã đăng ký Gói 1</label><div class="small muted">Gói bổ sung không cộng lại tiền Gói 1.</div>`:''}<hr class="divider"><div class="summaryrow"><span>Giá ${training?'gói 12 tháng':'năm đầu'}</span><span>${money(base)}</span></div><div class="summaryrow"><span>Giá sau giảm, chưa thuế</span><strong>${money(total)}</strong></div><div class="notice">${config?`Ngưỡng thử: ${s.config.money} triệu hoặc ${s.config.discount}% giảm thêm. Cần <strong>${approver==='director'?'giám đốc':'trưởng nhóm'}</strong> duyệt.`:'Chưa cấu hình ngưỡng. Mở Cấu hình → Nạp ngưỡng minh họa để thử luồng duyệt.'}</div><div class="small muted">Xét giá năm đầu sau giảm là giả định của bản mẫu. Cơ sở tính thực tế và thứ tự duyệt vượt ngưỡng cần chốt.</div><div class="row" style="margin-top:14px">${btn('quote-submit','Gửi duyệt',!canEdit||!config||needCore&&!q.hasCore,true)}${btn('quote-edit','Tạo bản sửa',!canWork(q.customer)||edit||q.state==='Chờ duyệt')}</div></section><section class="panel"><div class="quotehead"><div class="logo">iViTech</div><span class="small muted">CÔNG TY CỔ PHẦN CÔNG NGHỆ IVITECH</span></div><h2>${training?'ĐÀO TẠO & CHUYỂN GIAO AI':'BÁO GIÁ SMART IVIER'}</h2><p>Kính gửi: <strong>${clients[q.customer].name}</strong></p><p>${p[0]}</p><div class="amount">${money(total)}</div><p class="small muted">Chưa bao gồm thuế · giá tham khảo</p>${design.preview?`<div class="listline"><strong>Phạm vi</strong><div>${training?'05 chuyên đề, tài liệu & prompt mẫu, hỗ trợ sử dụng; số tài khoản theo gói.':'Phạm vi và hạn mức theo gói được lựa chọn. Các mục chi tiết sẽ lấy từ mẫu dịch vụ.'}</div></div><div class="listline"><strong>Thời hạn</strong><div>${training?'12 tháng từ ngày kích hoạt.':'12 tháng từ ngày nghiệm thu đưa vào sử dụng, theo tài liệu mẫu.'}</div></div><div class="listline"><strong>Gia hạn</strong><div>${p[2]?money(p[2])+' / năm · trước thuế, chưa tính giảm thêm':'Chưa có giá gia hạn riêng trong tài liệu'}</div></div>`:''}<p class="small muted" style="margin-top:15px">Hiệu lực dự kiến: 30 ngày từ ngày phát hành. Bản xem bố cục, chưa tạo PDF.</p></section></div><section class="panel" style="margin-top:14px"><h2>Duyệt & gửi</h2><div class="row">${btn('quote-approve','Duyệt bản v'+q.version,q.state!=='Chờ duyệt'||s.role!==approver,true)}${btn('quote-revise','Yêu cầu sửa',q.state!=='Chờ duyệt'||s.role!==approver)}${btn('quote-send','Gửi báo giá mô phỏng',q.state!=='Đã duyệt'||!canWork(q.customer),true)}</div><div class="small muted" style="margin-top:10px">Đổi vai ở phía trên để thử duyệt. Gửi đến ${clients[q.customer].name} qua ${clients[q.customer].channel}; không có tin thật.</div>${logs(q.log)}</section>`;
 }
 function knowledge(){const k=s.kb,editor=s.role==='manager',reviewer=s.role==='director';return head('Nội dung bot','Trưởng nhóm chuẩn bị → giám đốc duyệt → bot được sử dụng')+`<div class="grid"><section class="panel"><div class="row between mb"><h2>Thời hạn dịch vụ đào tạo</h2>${badge(k.state)}</div><label><span>Nội dung trả lời · phiên bản v${k.version}</span><textarea id="kb-text" ${editor&&k.state!=='Chờ duyệt'?'':'disabled'}>${esc(k.text)}</textarea></label><div class="row" style="margin-top:14px">${btn('kb-save','Lưu bản nháp',!editor||k.state==='Chờ duyệt')}${btn('kb-submit','Gửi giám đốc duyệt',!editor||k.state!=='Nháp',true)}</div><hr class="divider"><h3>Phê duyệt</h3><div class="row">${btn('kb-approve','Duyệt để bot sử dụng',!reviewer||k.state!=='Chờ duyệt',true)}${btn('kb-reject','Trả về chỉnh sửa',!reviewer||k.state!=='Chờ duyệt')}</div><div class="small muted" style="margin-top:12px">Giá và cam kết thương mại chưa duyệt không được đưa vào câu trả lời.</div>${logs(k.log)}</section><section class="panel"><h2>Bot đang được phép dùng</h2>${k.approvedText?`<div class="bubble out">${esc(k.approvedText)}</div>`:'<p>Chưa có nội dung được duyệt.</p>'}<div class="notice">Bản sửa chưa được duyệt không thay nội dung đang dùng. Giữ bản đã duyệt còn hiệu lực là cách xử lý đề xuất.</div><h3>Ngoài giờ làm việc</h3><p class="muted">Bot trả lời FAQ đã duyệt, ghi nhận nhu cầu và báo nhân viên sẽ liên hệ trong giờ làm việc. Không hứa giờ cụ thể.</p><h3>Khi nhân viên tiếp nhận</h3><p class="muted">Bot dừng. Chỉ hoạt động lại sau thao tác “Chuyển lại cho bot”.</p>${btn('go-inbox','Thử bàn giao trong Hộp thư')}</section></div>`;}
 function settings(){const admin=s.role==='admin';return head('Cấu hình công ty','Các giá trị dưới đây chỉ dùng minh họa, không lưu vào hệ thống thật')+`<div class="grid"><section class="panel"><h2>Ngưỡng duyệt báo giá</h2><p class="small muted">Trưởng nhóm duyệt thông thường; vượt một trong hai ngưỡng cần giám đốc.</p><div class="fieldgrid"><label><span>Giá trị vượt (triệu VNĐ)</span><input id="config-money" type="number" min="0" value="${s.config.money}" placeholder="Công ty tự điền" ${admin?'':'disabled'}></label><label><span>Giảm thêm vượt (%)</span><input id="config-discount" type="number" min="0" max="100" value="${s.config.discount}" placeholder="Công ty tự điền" ${admin?'':'disabled'}></label></div><div class="row" style="margin-top:14px">${btn('config-demo','Nạp ngưỡng minh họa',!admin)}${btn('config-save','Lưu ngưỡng mẫu',!admin,true)}</div><div class="notice">600 triệu / 10% chỉ là ví dụ để bấm thử, không phải quy định iViTech. Quyền admin sửa ngưỡng đang đề xuất.</div></section><section class="panel"><h2>Lịch làm việc sales</h2><div class="day">${['T2','T3','T4','T5','T6','T7','CN'].map((d,i)=>`<label><input type="checkbox" data-day="${i}" ${s.config.days[i]?'checked':''} ${admin?'':'disabled'}>${d}</label>`).join('')}</div><div class="fieldgrid" style="margin-top:14px"><label><span>Từ giờ</span><input id="work-start" type="time" value="${s.config.start}" ${admin?'':'disabled'}></label><label><span>Đến giờ</span><input id="work-end" type="time" value="${s.config.end}" ${admin?'':'disabled'}></label></div><p class="small muted" style="margin-top:12px">Giờ Việt Nam · lịch mẫu, chưa phải giờ làm việc công ty. Thiết kế hiện minh họa một khung giờ chung.</p>${btn('schedule-save','Lưu lịch mẫu',!admin,true)}<div class="small muted" style="margin-top:10px">${s.config.saved?'Đã lưu lịch minh họa.':'Lịch chưa được lưu.'}</div></section></div><section class="panel" style="margin-top:14px"><h2>Kết nối kênh</h2><div class="summaryrow"><span>Zalo OA</span>${badge('Mô phỏng · chưa kết nối')}</div><div class="summaryrow"><span>Zalo cá nhân công ty · 1 tài khoản</span>${badge('Cần kiểm chứng tích hợp')}</div><p class="small muted" style="margin-top:12px">Bản mẫu không yêu cầu đăng nhập, mật khẩu hoặc quét mã QR.</p></section>`;}
 function guide(){return head('Kịch bản duyệt thiết kế','Bấm thử cách làm việc; dữ liệu và trạng thái chỉ tồn tại trong bản mẫu')+`<section class="panel"><div class="reviewline"><strong>01</strong><div><h3>Giao khách & bàn giao bot</h3><p>Vai Trưởng nhóm → Hộp thư → giao Đơn vị Bình Minh cho Lan. Chuyển vai Lan → Tiếp nhận → gửi phản hồi mẫu → Chuyển lại cho bot.</p>${btn('go-inbox','Mở Hộp thư')}</div></div><div class="reviewline"><strong>02</strong><div><h3>Tạo, duyệt và gửi báo giá</h3><p>Vai Admin → Cấu hình → Nạp ngưỡng minh họa. Đổi sang Trưởng nhóm → Báo giá → chọn dịch vụ, xác nhận Gói 1 nếu cần → Gửi duyệt → duyệt đúng vai → gửi mô phỏng.</p>${btn('go-quote','Mở Báo giá')}</div></div><div class="reviewline"><strong>03</strong><div><h3>Duyệt nội dung trước khi bot dùng</h3><p>Vai Trưởng nhóm → sửa nội dung → Lưu bản nháp → Gửi giám đốc duyệt. Đổi vai Giám đốc → Duyệt. Quan sát nội dung bot được dùng thay đổi.</p>${btn('go-knowledge','Mở Nội dung bot')}</div></div><div class="reviewline"><strong>04</strong><div><h3>Theo dõi cơ hội</h3><p>Vai Trưởng nhóm, đã giao khách → Cơ hội bán hàng. Thử Thắng khi chưa ký; thử Thua rồi mở lại kèm lý do. Lịch sử được giữ nguyên.</p>${btn('go-pipeline','Mở Cơ hội')}</div></div><div class="notice">Vai giám đốc/admin chỉ để kiểm tra luồng duyệt và cấu hình. Nhóm dùng thử nghiệp vụ vẫn là 2 sales và 1 trưởng nhóm. Chưa xác định người thật giữ hai vai trò này.</div></section>`;}
 function render(){root.style.setProperty('--space',design.density==='Gọn'?'14px':'20px');root.querySelector('#omni-role').value=s.role;root.querySelectorAll('[data-page]').forEach(b=>{b.classList.toggle('active',b.dataset.page===s.page);b.setAttribute('aria-current',b.dataset.page===s.page?'page':'false');});main.innerHTML=({inbox,customer,pipeline,quote,knowledge,settings,guide}[s.page]||inbox)();}
 root.addEventListener('change',e=>{const el=e.target;if(el.id==='omni-role'){s.role=el.value;tell('Đang thử vai '+names[s.role]+'. Dữ liệu hiển thị theo phạm vi của vai này.');}else if(el.id==='quote-type'){s.quote.type=el.value;s.quote.pkg=el.value==='training'?'ai10':'g3';s.quote.hasCore=false;}else if(el.id==='quote-package'){s.quote.pkg=el.value;}else if(el.id==='quote-discount'){s.quote.discount=Math.min(100,Math.max(0,Number(el.value)||0));}else if(el.id==='core'){s.quote.hasCore=el.checked;}else{return;}render();persist();});
 root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;
  if(b.dataset.page){s.page=b.dataset.page;render();persist();return;}
  if(b.dataset.client){s.cid=b.dataset.client;render();persist();return;}
  const a=b.dataset.action;if(!a)return;
  let message='';const q=s.quote,k=s.kb;
  if(a.startsWith('go-')){s.page=a.slice(3);if(a==='go-quote'&&s.quote.state==='Nháp'&&canWork(s.cid))s.quote.customer=s.cid;}
  else if(a.startsWith('assign-')&&s.role==='manager'&&!s.owners[s.cid]){const id=a.slice(7);s.owners[s.cid]=id;message='Đã giao khách mẫu cho '+names[id]+'. Đổi vai sales để thử tiếp nhận.';}
  else if(a==='take'&&canWork(s.cid)){s.human[s.cid]=true;message='Nhân viên đã tiếp nhận. Bot dừng tự trả lời.';}
  else if(a==='return'&&canWork(s.cid)){s.human[s.cid]=false;message='Đã chuyển lại cho bot. Thử tin nhắn mới để xem nội dung được duyệt.';}
  else if(a==='incoming'){s.chats[s.cid].push(['Khách · '+clients[s.cid].channel,'Thời hạn dịch vụ đào tạo được tính như thế nào?']);if(!s.human[s.cid]&&k.approvedText)s.chats[s.cid].push(['Bot · nội dung đã duyệt',k.approvedText]);message=s.human[s.cid]?'Tin mẫu đã đến. Bot không chen vào khi người đang xử lý.':'Bot phản hồi bằng nội dung đã duyệt, chỉ mô phỏng.';}
  else if(a==='send-reply'&&canWork(s.cid)&&s.human[s.cid]){const text=main.querySelector('#reply').value.trim();if(!text){tell('Hãy nhập phản hồi trước khi gửi.');return;}s.chats[s.cid].push([names[s.role]+' · nhân viên',text]);message='Đã thêm phản hồi mẫu. Không gửi đến Zalo thật.';}
  else if(a==='stage-save'&&canWork('org')){const next=main.querySelector('#stage').value,reason=main.querySelector('#stage-reason').value.trim(),signed=main.querySelector('#signed').checked;if(next===s.stage){tell('Hãy chọn một bước khác.');return;}if(s.stage==='Thắng'){tell('Mở lại cơ hội đã thắng chưa nằm trong quy tắc đã chốt.');return;}if(next==='Thắng'&&!signed){tell('Chỉ ghi nhận Thắng khi hai bên đã ký hợp đồng.');return;}if((next==='Thua'||s.stage==='Thua')&&!reason){tell('Cần ghi lý do thua hoặc lý do mở lại.');return;}s.history.push(names[s.role]+': '+s.stage+' → '+next+(reason?' · '+reason:''));s.stage=next;s.signed=signed;message='Đã cập nhật cơ hội mẫu và giữ toàn bộ lịch sử.';}
  else if(a==='quote-submit'){q.state='Chờ duyệt';q.approver=(packages[q.pkg][1]*(1-q.discount/100)>Number(s.config.money)*1000000||q.discount>Number(s.config.discount))?'director':'manager';q.log.push('v'+q.version+' gửi duyệt · '+names[q.approver]);message='Đã gửi duyệt mô phỏng. Chọn vai '+names[q.approver]+' để duyệt.';}
  else if(a==='quote-approve'&&s.role===q.approver){q.state='Đã duyệt';q.log.push(names[s.role]+' duyệt v'+q.version);message='Đã duyệt đúng phiên bản mẫu. Sales phụ trách hoặc trưởng nhóm có thể thử gửi.';}
  else if(a==='quote-revise'&&s.role===q.approver){q.state='Yêu cầu sửa';q.log.push(names[s.role]+' yêu cầu sửa v'+q.version);message='Báo giá quay về chỉnh sửa; chưa được gửi khách.';}
  else if(a==='quote-edit'){q.version++;q.state='Nháp';q.log.push('Tạo bản nháp v'+q.version+'; bản cũ giữ trong lịch sử mô phỏng');message='Phiên bản mới cần được duyệt lại trước khi gửi.';}
  else if(a==='quote-send'&&q.state==='Đã duyệt'&&canWork(q.customer)){q.state='Đã gửi';q.log.push('Gửi mô phỏng v'+q.version+' → '+clients[q.customer].name+' · '+clients[q.customer].channel);message='Gửi mô phỏng thành công. Không tạo PDF hoặc gửi tin thật.';}
  else if(a==='kb-save'&&s.role==='manager'){const text=main.querySelector('#kb-text').value.trim();if(!text){tell('Nội dung không được để trống.');return;}if(k.state==='Đã duyệt')k.version++;k.text=text;k.state='Nháp';k.log.push('Trưởng nhóm lưu bản nháp v'+k.version);message='Bản sửa chưa được bot sử dụng; cần giám đốc duyệt.';}
  else if(a==='kb-submit'&&s.role==='manager'){k.state='Chờ duyệt';k.log.push('Gửi giám đốc duyệt v'+k.version);message='Đổi vai Giám đốc để xem và duyệt.';}
  else if(a==='kb-approve'&&s.role==='director'){k.state='Đã duyệt';k.approvedText=k.text;k.log.push('Giám đốc duyệt v'+k.version);message='Bot được dùng đúng nội dung mới đã duyệt.';}
  else if(a==='kb-reject'&&s.role==='director'){k.state='Nháp';k.log.push('Giám đốc trả lại v'+k.version);message='Trả về trưởng nhóm chỉnh sửa. Bot tiếp tục dùng bản đã duyệt trước.';}
  else if(a==='config-demo'&&s.role==='admin'){s.config.money='600';s.config.discount='10';message='Đã nạp 600 triệu / 10% chỉ để thử, không phải quy định công ty.';}
  else if(a==='config-save'&&s.role==='admin'){const m=main.querySelector('#config-money').value,d=main.querySelector('#config-discount').value;if(m===''||d===''||Number(m)<0||Number(d)<0||Number(d)>100){tell('Nhập hai ngưỡng hợp lệ; tỷ lệ từ 0 đến 100. Ô trống không được hiểu là 0.');return;}s.config.money=m;s.config.discount=d;message='Đã lưu ngưỡng trong bản mẫu, không áp dụng vào công ty.';}
  else if(a==='schedule-save'&&s.role==='admin'){const start=main.querySelector('#work-start').value,end=main.querySelector('#work-end').value;if(!start||!end||start>=end){tell('Khung giờ mẫu phải có giờ bắt đầu trước giờ kết thúc.');return;}s.config.start=start;s.config.end=end;s.config.days=[...main.querySelectorAll('[data-day]')].map(x=>x.checked);s.config.saved=true;message='Đã lưu lịch minh họa. Bot đã bàn giao không tự bật lại khi đổi lịch.';}
  render();persist();if(message)tell(message);
 });
 window.addEventListener('openai:set_globals',e=>{const st=e.detail?.globals?.widgetState?.privateContent?.omni;if(st?.schema===1&&st.data?.kb){s=st.data;render();}});
 render();if(globalThis.Tweak){const t=new Tweak({container:root,onChange:render});t.addSelect(design,'density',{label:'Khoảng cách nội dung',options:['Thoáng','Gọn']});t.addToggle(design,'preview',{label:'Chi tiết trong bản xem báo giá'});}
})();
</script>
